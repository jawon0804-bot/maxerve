<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Maxerve SMART</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root { --primary: #5c9ce6; --success: #34a853; --warning: #f39c12; --bg: #f8f9fa; }
        
        /* 기본 설정: Tailwind 초기화 대응 */
        body { font-family: 'Malgun Gothic', sans-serif; background-color: var(--bg); margin: 0; padding: 15px; color: #333; line-height: 1.6; }
        
        /* 카드 레이아웃 */
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin-bottom: 25px; }

        /* [수정] 메인 제목: Tailwind 간섭 방지를 위해 ID와 !important 사용 */
        #facility-title {
            font-size: 1.8rem !important; 
            font-weight: 800 !important;
            color: var(--primary) !important; 
            border-left: 8px solid var(--primary) !important; 
            padding-left: 15px !important; 
            margin-bottom: 15px !important; 
            line-height: 1.2 !important;
            display: flex !important;
        }

		.stop-tag { display: inline-block !important; padding: 4px 10px !important; border-radius: 4px !important;
			font-size: 0.8rem !important; font-weight: bold !important;background: #e8f0fe !important; 
			color: var(--primary) !important; margin-bottom: 12px !important; border: 1px solid #d2e3fc !important;                  
        }

        /* [수정] 카테고리 태그 스타일 (과장님이 올려주신 기존 코드) */
		.status-tag { 
		    display: inline-block !important; 
		    padding: 4px 10px !important; 
		    border-radius: 4px !important; 
		    font-size: 0.8rem !important; 
		    font-weight: bold !important;
		    background: #e8f0fe !important; 
		    color: var(--primary) !important; 
		    margin-bottom: 12px !important; 
		    border: 1px solid #d2e3fc !important;
			max-width: 180px !important; 
		    width: 100% !important;
		    text-align: center !important;
		}
		
		#step-auth input {
		    display: block !important;    /* 한 줄에 하나씩 차지하게 함 */
		    width: 100% !important;       /* 가로 꽉 채우기 */
		    margin-bottom: 10px !important; /* ⭐ 아래쪽 박스와의 간격 (이걸로 조절!) */
		    padding: 12px !important;      /* 박스 안쪽 여백 (터치하기 편하게) */
		    border: 1px solid #ddd !important;
		    border-radius: 8px !important;
		}

		/* 마지막 입력창(전화번호)과 버튼 사이도 좀 띄워주면 예쁩니다 */
		#loginPhone {
		    margin-bottom: 20px !important; 
		}



        /* [통합] 입력창 스타일: 터치하기 좋게 크기 확대 */
        input, select, textarea, .check-input { 
            width: 100%; 
            padding: 12px 10px !important; 
            border: 1px solid #dadce0 !important; 
            border-radius: 8px !important; 
            box-sizing: border-box; 
            font-size: 1.1rem !important; 
            margin-bottom: 10px; 
            background-color: #ffffff;
            transition: all 0.2s;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--primary) !important; background-color: #f0f7ff !important; outline: none; }

        /* [수정] 라벨 스타일: 제목과 박스 사이 간격 확보 */
        label { display: block; font-weight: bold; margin-bottom: 10px; font-size: 0.95rem; color: #333; }

        /* 구분선 스타일 */
        hr { border: none; border-top: 1px solid #eee !important; margin: 25px 0 !important; }
        .hr-strong { border-top: 2px solid var(--primary) !important; opacity: 0.8; margin-top: 0px !important; } /*  margin: 순서: [위] [오른쪽] [아래] [왼쪽] */
        .hr-dotted { border-top: 1.5px dotted #4285f4 !important; margin-top: 0 !important; }

        /* 버튼 공통 스타일 */
        button { 
            width: 100%; min-height: 58px; border: none; border-radius: 10px; 
            font-size: 1.1rem; font-weight: bold; cursor: pointer; color: white; 
            display: flex; align-items: center; justify-content: center; line-height: 1; 
        }
        .btn-auth { margin-top: 20px; background: var(--primary); }
        .btn-photo { background: var(--warning); margin: 20px 0; }
        .btn-submit { background: var(--success); margin-top: 30px; font-size: 1.2rem; }

        /* 사진 미리보기 */
        #photo-preview-container { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
        .preview-box { width: 80px; height: 80px; border-radius: 8px; overflow: hidden; border: 1px solid #ddd; position: relative; }
        .preview-box img { width: 100%; height: 100%; object-fit: cover; }

        /* 로딩 레이어 */
        #loading-layer { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(255, 255, 255, 0.9); z-index: 9999; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
        }
        .spinner { width: 50px; height: 50px; border: 5px solid #f3f3f3; border-top: 5px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* 기타 스타일 */
        .info-text-only { padding: 12px 0; color: #555; font-size: 0.95rem; line-height: 1.6; border: none; background: transparent; }
        .hidden { display: none !important; }
        
        /* QR 버튼 스타일 */
        .qr-button-container { display: flex; flex-direction: column; align-items: center; margin: 30px 0; }
        .transparent-circle-btn {
		    width: 70px;
		    height: 70px;
		    border-radius: 50%;
		    
		    /* 1. 배경만 투명하게 (화이트 배경 삭제) */
		    background: transparent !important; 
		    
		    /* 2. 그림자는 원래대로 복구 (약간의 입체감) */
		    box-shadow: 0 8px 15px rgba(0,0,0,0.2) !important; 
		    
		    /* 3. 테두리를 아주 연하게 주면 투명 버튼이 더 예뻐 보입니다 */
		    border: 1px solid rgba(0,0,0,0.1) !important;
		    
		    font-size: 1.8rem; 
		    display: flex;
		    align-items: center;
		    justify-content: center;
		    cursor: pointer;
		    transition: all 0.3s ease;
		    -webkit-tap-highlight-color: transparent;
		}

		/* 눌렀을 때 반응: 그림자가 줄어들면서 쏙 들어가는 느낌 */
		.transparent-circle-btn:active, .btn-submit:active, .btn-photo:active, .btn-auth:active {
		    transform: translateY(5px);
		    box-shadow: 0 6px 12px rgba(0,0,0,0.4) !important;
		}
    </style>
</head>
<body>

    <div id="step-auth" class="card hidden">
        <h2 class="flex items-center gap-2 font-bold text-lg mb-4">🪪 점검자 인증</h2>
        <p class="mb-4 text-gray-600">🔑 등록된 이름과 번호를 입력하세요.</p>
        <input type="text" id="loginName" placeholder="성함 입력">
        <input type="tel" id="loginPhone" placeholder="전화번호 입력 (숫자만)">
        <button onclick="handleLogin()" class="btn-auth"><b>인증 및 점검 시작</b></button>
    </div>

    <div id="step-scan" class="card hidden text-center py-10">
        <img src="icon.png" class="w-48 mx-auto mb-6">
        <h2 id="welcome-msg" class="text-xl font-bold mb-4">안녕하세요</h2>
        <p class="text-gray-600 mb-8">준비가 완료되었습니다.<br><b>설비의 태그(NFC/QR)</b>를 <br>
        스캔하여 점검을 시작해 주세요.</p>
        
        <div style="font-size: 3rem; margin-bottom: 20px;">📳</div>
        <div class="status-tag">태그 인식 대기 중</div>
        <div class="qr-button-container">
            <button onclick="openScanner()" class="transparent-circle-btn">📷</button>
            <p class="mt-3 text-sm text-gray-400">QR 스캔 시작</p>
        </div>
    </div>

    <div id="loading-layer" class="hidden">
        <div class="spinner"></div>
        <p class="text-center mt-2 font-bold text-slate-600 animate-bounce">Loading data...</p>
	</div>

    <form id="inspection-form" class="hidden">
        <div class="card" id="form-container">
            <div id="facility-category" class="stop-tag">설비 인식 중...</div>
            <h1 id="facility-title">점검표 로딩 중...</h1>
            
                <p style="font-size: 0.8rem; color: #666; display: flex; align-items: center; gap: 4px;">
                    <span style="font-size: 1.3rem; line-height: 1; margin-bottom: 2px;">🪪</span> 
                    <span>점검자: <span id="display-worker"></span></span>
                </p>
            <hr class="hr-dotted">
            
            <div id="dynamic-items"></div>
            <hr class="hr-dotted">
            <h2 class="font-bold text-gray-700 mb-3">📝 특이사항</h2>
            <div class="mb-5">
                <label>📷 현장 사진 (최대 3장)</label>
                <div id="photo-preview-container"></div>
                <button type="button" onclick="addPhoto()" class="btn-photo">📸 사진 추가</button>
            </div>
            <div class="mb-5">
                <label>특이사항 메모</label>
                <textarea id="memo" rows="3" placeholder="내용을 입력하세요."></textarea>
            </div>
            <button type="button" onclick="submitToSheet()" id="submit-btn" class="btn-submit">✅ 점검 완료 및 전송</button>
        </div>
    </form>

    <div id="scanner-modal" class="fixed inset-0 bg-black/80 z-[9999] hidden text-center">
        <div id="reader" class="w-[300px] mx-auto mt-24 bg-white rounded-2xl overflow-hidden"></div>
        <button onclick="closeScanner()" class="mt-8 px-10 py-3 bg-white text-black rounded-lg font-bold mx-auto">닫기</button>
    </div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    let fId = urlParams.get('id') || urlParams.get('fId') || ""; 
    let photoData = [];

    const AUTH_URL = "https://script.google.com/macros/s/AKfycbyS_5N2XW4rT1ffJCngvRdx85nzzuDCMEqFkOlcVo5ijaGjdW2NBsOTm_kLgo9qQZ_Y/exec";
    const webAppUrl = "https://script.google.com/macros/s/AKfycbxUT5Q-nW5X86vUhVNQxc0GgCiFa1Ek3-mWJyEER4E0wBsNbcpr_3EMyhYCcATxy3V_/exec";

    // 🎯 [과장님 수정 요청] 앱이 켜질 때 로컬스토리지에서 이름, 전번뿐만 아니라 시트에서 당겨온 센터명까지 3종 세트가 다 있는지 체크합니다.
    window.onload = function() {
        const savedCenter = localStorage.getItem('userCenter'); // 신설
        const savedName = localStorage.getItem('userName');
        const savedPhone = localStorage.getItem('userPhone');

        if (savedCenter && savedName && savedPhone) {
            // 센터명까지 확실히 존재한다면 프리패스로 점검 페이지 진입
            startInspection(savedCenter, savedName, savedPhone);
        } else {
            // 정보가 하나라도 없으면 데이터 입력창(인증 화면) 활성화
            document.getElementById('step-auth').classList.remove('hidden');
        }
    };

    // 🎯 [과장님 수정 요청] handleLogin 함수 수정
    // 이름/전번만 입력받아 인증 시트로 찌르고, 성공 시 시트 A열에서 매칭되어 날아온 센터명을 폰 메모리에 포장 적재합니다.
    function handleLogin() {
        const name = document.getElementById('loginName').value.trim();
        const phone = document.getElementById('loginPhone').value.trim();
        if (!name || !phone) { alert("성함과 번호를 입력해주세요."); return; }
        
        toggleLoading(true);
        
        // 인증시트 관문(AUTH_URL)으로 이름과 전번만 토스
        fetch(`${AUTH_URL}?name=${encodeURIComponent(name)}&phone=${encodeURIComponent(phone)}`)
        .then(res => res.text())
        .then(result => {
            const trimmedResult = result.trim();
            
            // 💡 [핵심] 만약 구글 인증 웹앱이 텍스트 형태로 센터명을 뱉어내거나 JSON으로 주도록 세팅되어 있을 때의 대응선입니다.
            // 구글 스크립트가 성공 시 센터명을 직접 뱉어주도록 (예: "울산2센터" 혹은 "SUCCESS:울산2센터") 변경되는 규격에 맞춥니다.
            if (trimmedResult !== "FAILED" && trimmedResult !== "ERROR" && trimmedResult !== "") {
                
                // 구글 백엔드가 "SUCCESS"만 주지 않고 뒤에 센터명을 붙여주거나, 센터명 자체를 반환할 때를 대비한 안전망 분파
                let centerName = "미지정센터";
                if (trimmedResult.startsWith("SUCCESS:")) {
                    centerName = trimmedResult.split(":")[1]; // "SUCCESS:울산2센터" 구조일 때 뒤의 알맹이 추출
                } else if (trimmedResult === "SUCCESS") {
                    centerName = "자동지정센터"; // 구글 스크립트 연동 기본값 대응
                } else {
                    centerName = trimmedResult; // 구글 스크립트가 시트 A열 문자열("울산2센터") 자체를 뱉어줬을 때
                }

                // 폰 메모리 장부에 이름, 번호와 함께 시트가 확인해준 센터명을 안전하게 임베딩(setItem)
                localStorage.setItem('userCenter', centerName);
                localStorage.setItem('userName', name);
                localStorage.setItem('userPhone', phone);
                
                // 마스터 동기화 폼 입장
                startInspection(centerName, name, phone);
            } else {
                alert("❌ 등록되지 않은 사용자입니다. 정보가 일치하지 않습니다.");
                toggleLoading(false);
            }
        }).catch(() => { alert("네트워크 오류 발생"); toggleLoading(false); });
    }

    // 🎯 [과장님 수정 요청] startInspection 인자값에 center 명문화 추가
    function startInspection(center, name, phone) {
        document.getElementById('step-auth').classList.add('hidden');
        
        // 상단 인포바 화면 세팅 (소속 센터와 이름 결합 출력)
        if (document.getElementById('display-center')) {
            document.getElementById('display-center').innerText = center;
        }
        document.getElementById('display-worker').innerText = `${name}(${phone})`;
        document.getElementById('welcome-msg').innerText = `[${center}]\n안녕하세요, ${name} 님!`;

        let cleanFId = decodeURIComponent(fId).trim();
        if (!cleanFId || cleanFId === "미등록설비") {
            document.getElementById('step-scan').classList.remove('hidden');
            toggleLoading(false);
        } else {
            loadFacilityConfig(cleanFId);
        }
    }

		// 🚀 '...' 순차 노출 자바스크립트 엔진
		let dotCount = 0;
		const statusElement = document.querySelector('.status-tag'); // 태그 박스 찾기
		
		if (statusElement) {
		  setInterval(() => {
		    dotCount = (dotCount + 1) % 4; // 0, 1, 2, 3 무한 반복
		    const dots = '.'.repeat(dotCount); // 숫자에 맞춰 점 생성
		    statusElement.innerText = '📡 태그 인식 대기중' + dots;
		  }, 500); // 0.5초마다 점 개수 변경
		}

    // [기존 코드 100% 보존 구역] 설비 설정 로드 기능
    function loadFacilityConfig(targetFid) {
        toggleLoading(true);

        // 🎯 [과장님 픽스 핵심] 폰 메모리(localStorage)에 문신처럼 박혀있는 정보 삼총사를 실시간으로 꺼냅니다.
        const savedCenter = localStorage.getItem('userCenter') || "미인증센터";
        const savedName = localStorage.getItem('userName') || "시스템자동";
        const savedPhone = localStorage.getItem('userPhone') || "0000";

        // 🎯 [데이터 동봉] 원래 주소 뒤에 &centerName, &worker, &phone을 자석처럼 착 붙여서 보냅니다.
        const requestUrl = `${webAppUrl}?fid=${encodeURIComponent(targetFid)}` +
                           `&centerName=${encodeURIComponent(savedCenter)}` +
                           `&worker=${encodeURIComponent(savedName)}` +
                           `&phone=${encodeURIComponent(savedPhone)}`;

        // 개조된 직통 주소(requestUrl)로 출발!
        fetch(requestUrl)
        .then(res => res.text())
        .then(text => {
            const trimmedText = text.trim();
            if (trimmedText.includes("✅") && !trimmedText.startsWith("{")) {
                alert(trimmedText);
                location.href = location.pathname; 
                return;
            }
            if (trimmedText.startsWith("{")) {
                const response = JSON.parse(trimmedText);
                
                document.getElementById('step-scan').classList.add('hidden');
                document.getElementById('inspection-form').classList.remove('hidden');
            
                const categoryEl = document.getElementById('facility-category');
                if (categoryEl) {
                    categoryEl.innerText = "[" + (response.category || "기타") + "]";
                }
            
                const titleEl = document.getElementById('facility-title');
                if (titleEl) {
                    titleEl.style.cssText = `
                        display: flex !important;
                        align-items: flex-start !important;
                        font-size: 1.5rem !important;
                        line-height: 1.2 !important;
                    `;
                    titleEl.innerHTML = `
                        <span style="font-size: 1.5em; flex-shrink: 0; margin-right: 8px; display: inline-block;">📋</span>
                        <span style="flex: 1; word-break: break-all; display: inline-block;">${response.facilityName}</span>
                    `;
                    if (titleEl.offsetHeight > 55) { 
                        titleEl.style.setProperty('font-size', '1.2rem', 'important');
                    }
                }
    
                renderDynamicForm(response.configString);
                setTimeout(() => toggleLoading(false), 300);
            }
        }).catch(() => { alert("데이터 로드 실패"); toggleLoading(false); });
}

    // [기존 코드 100% 보존 구역] 동적 폼 렌더러
    function renderDynamicForm(configString) {
        const container = document.getElementById('dynamic-items');
        container.innerHTML = "";
        if(!configString) return;

        configString.split(';').forEach(item => {
            if(!item.trim()) return;
            const [name, type, options] = item.split('|');
            let labelTag = `<label>${name}</label>`;
            let inputTag = "";

            if (type === 'line') {
                container.innerHTML += `<hr class="hr-strong">`;
                return;
            }
            if (type === 'select') {
                const optHtml = (options || "").split(',').map(o => `<option value="${o}">${o}</option>`).join('');
                inputTag = `<select class="check-input"><option value="">선택</option>${optHtml}</select>`;
            } else if (type === 'info') {
                labelTag = "";
                inputTag = `<div class="info-text-only">✅ <strong>${name}</strong>: ${options || ""}</div>`;
            } else {
                inputTag = `<input type="${type==='number'?'number':'text'}" class="check-input" placeholder="내용 입력">`;
            }

            container.innerHTML += `<div class="mb-4">${labelTag}${inputTag}</div>`;
        });
    }

    // [기존 코드 100% 보존 구역] 카메라 및 압축 로직
    function addPhoto() {
        if(photoData.length >= 3) { alert("사진은 최대 3장까지 가능합니다."); return; }
        const input = document.createElement('input');
        input.type = 'file'; input.accept = 'image/*'; input.capture = 'camera';
        input.onchange = e => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = event => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 600;
                    let width = img.width, height = img.height;
                    if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    canvas.width = width; canvas.height = height;
                    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                    const data = canvas.toDataURL('image/jpeg', 0.6);
                    
                    const id = Date.now();
                    photoData.push(data);
                    const preview = document.createElement('div');
                    preview.id = `photo-${id}`;
                    preview.className = 'preview-box';
                    preview.innerHTML = `<img src="${data}"><div onclick="this.parentElement.remove(); photoData=photoData.filter(d=>d!='${data}');" 
					                      style="position:absolute; top:0; right:0; background:red; color:white; width:20px; height:20px; 
										  text-align:center; cursor:pointer;">×</div>`;
                    document.getElementById('photo-preview-container').appendChild(preview);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        };
        input.click();
    }

    let html5QrCode;
    function openScanner() {
        document.getElementById('scanner-modal').classList.remove('hidden');
        html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start({ facingMode: "environment" }, { fps: 20, qrbox: 250 }, (text) => {
            html5QrCode.stop();
            document.getElementById('scanner-modal').classList.add('hidden');
            if (confirm("점검표로 이동하시겠습니까?")) location.href = text;
        });
    }

    function closeScanner() { 
        if(html5QrCode) html5QrCode.stop();
        document.getElementById('scanner-modal').classList.add('hidden'); 
    }

    // 🎯 [과장님 수정 요청] 파이어베이스 데이터 전송 함수 (submitToSheet) 개조
    // 전송 봉투를 꾸릴 때, 로그인할 때 매칭해서 숨겨둔 'userCenter' 값을 박스 첫머리에 동봉하여 쏩니다. FID는 기존 규격 유지!
    function submitToSheet() {
	    const center = localStorage.getItem('userCenter') || "미인증센터"; 
	    const worker = localStorage.getItem('userName') || "미인증";
	    const memo = document.getElementById('memo').value;
	    const btn = document.getElementById('submit-btn');
	
	    const inputs = document.querySelectorAll('.check-input');
	    let detailData = [];
	    inputs.forEach(el => detailData.push(el.value || ""));
	
	    let finalValues = new Array(20).fill("");
	    for(let i=0; i<detailData.length; i++) {
	        finalValues[i] = detailData[i];
	    }
	
	    if(confirm("점검 데이터를 전송하시겠습니까?")) {
	        btn.innerText = "🚀 전송 중...";
	        btn.disabled = true; 
	
	        fetch(webAppUrl, {
	            method: 'POST',
	            body: JSON.stringify({
	                centerName: center, 
	                worker: worker,
	                fId: fId,           
	                memo: memo,
	                photoData: photoData,
	                values: finalValues
	            })
	        })
	        .then(res => res.text())
	        .then(result => {
	            if (result.indexOf("SUCCESS") !== -1) {
	                alert("✅ 점검 결과가 정상적으로 전송되었습니다.");
	
	                if (typeof fId !== 'undefined' && fId) {
	                    localStorage.setItem('completed_form_' + fId, 'true');
	                }
	
	                // 1단계: 수동 클릭 및 자동 타이머가 공통으로 사용할 3초 로딩 이동 함수
	                window.finishAndGoToScan = function() {
	                    // 진입 즉시 fId 변수를 비우고 작동 중이던 타이머 파괴
	                    fId = null; 
	                    clearTimeout(window.moveTimer);
	                    clearInterval(window.countdownInterval);
	                    
	                    // 최상단에 로딩창을 강제로 켭니다.
	                    toggleLoading(true); 
	                    
	                    // 정확히 3초(3000ms) 동안 로딩창을 유지합니다.
	                    setTimeout(() => { 
	                        toggleLoading(false); // 3초 뒤 로딩창 끄기
	                        
	                        // 🎯 [숙제 해결 핵심!] 주소창의 ?id=... 파라미터를 새로고침 없이 흔적도 없이 지웁니다.
	                        // 이 코드가 실행되면 주소창이 그냥 '.../index.html' 깔끔한 상태로 바뀝니다.
	                        const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
	                        window.history.replaceState({ path: cleanUrl }, '', cleanUrl);
	                        
	                        // !important를 적용하여 확실하게 이전 폼을 숨깁니다.
	                        const inspectForm = document.getElementById('inspection-form');
	                        if (inspectForm) {
	                            inspectForm.style.setProperty('display', 'none', 'important');
	                        }
	                        
	                        // 숨겨져 있던 진짜 스캔 화면을 확실하게 띄웁니다!
	                        const scanPage = document.getElementById('step-scan');
	                        if (scanPage) {
	                            scanPage.classList.remove('hidden'); 
	                            scanPage.style.setProperty('display', 'block', 'important');
	                        }
	                    }, 3000); 
	                };
	                
	                // 2단계: 화면에 완료 안내 카드와 [바로 이동하기] 버튼을 함께 띄웁니다.
	                document.getElementById('inspection-form').innerHTML = `
	                    <div class="card" style="text-align:center; padding: 50px 20px;">
	                        <div style="font-size: 3rem; margin-bottom: 20px;">🎉</div>
	                        <h2 style="font-size: 1.5rem; color: #34a853; font-weight: bold;">모든 점검 완료!</h2>
	                        <p style="margin: 20px 0; color: #666; line-height: 1.6;">
	                            데이터가 서버에 성공적으로 기록되었습니다.<br>
	                            <strong style="color: #1a73e8;"><span id="auto-timer">3</span>초 후 다음 단계로 자동 이동합니다.</strong>
	                        </p>
	                        
	                        <button type="button" onclick="finishAndGoToScan()" class="btn-auth" style="background:#1a73e8; color:white; border:none; padding:12px 24px; border-radius:4px; cursor:pointer; font-weight:bold; font-size:1rem;">
	                            바로 이동하기
	                        </button>
	                    </div>
	                `;
	
	                // 3단계: 화면의 숫자를 3 -> 2 -> 1 초 단위로 깎아주는 카운트다운 타이머 구동
	                let timeLeft = 3;
	                window.countdownInterval = setInterval(() => {
	                    timeLeft--;
	                    const timerEl = document.getElementById('auto-timer');
	                    if (timerEl) timerEl.innerText = timeLeft;
	                }, 1000);
	
	                // 4단계: 유저가 가만히 있어도 3초 뒤에 자동으로 이동 함수를 실행시키는 타이머
	                window.moveTimer = setTimeout(() => {
	                    finishAndGoToScan();
	                }, 2000);
	
	            } else {
	                alert("⚠️ 전송 실패: " + result);
	                btn.innerText = "다시 시도";
	                btn.disabled = false;
	            }
	        })
	        .catch(err => {
	            console.error("전송 에러:", err);
	            alert("🌐 네트워크 오류가 발생했습니다. 다시 시도해 주세요.");
	            btn.innerText = "다시 시도";
	            btn.disabled = false;
	        });
	    }
	}
    
	function toggleLoading(isVisible) {
        const loader = document.getElementById('loading-layer');
        if (!loader) return;
        if (isVisible) {
            loader.style.display = 'flex'; 
            loader.classList.remove('hidden');
        } else {
            loader.style.display = 'none';
            loader.classList.add('hidden');
        }
    }
</script>
</body>
</html>
