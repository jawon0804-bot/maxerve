<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Maxerve 스마트 점검</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <style>
        :root { --primary: #1a73e8; --success: #34a853; --warning: #f39c12; --bg: #f8f9fa; }
        body { font-family: 'Malgun Gothic', sans-serif; background-color: var(--bg); margin: 0; padding: 15px; color: #333; line-height: 1.6; }
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin-bottom: 20px; }
        h1 { font-size: 1.2rem; color: var(--primary); border-left: 5px solid var(--primary); padding-left: 10px; margin-bottom: 20px; }
        h2 { font-size: 0.95rem; background: #f1f3f4; padding: 10px; border-radius: 6px; margin: 20px 0 10px 0; font-weight: bold; }
        .item { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 0.85rem; color: #555; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #dadce0; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
        button { width: 100%; padding: 16px; border: none; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; color: white; }
        .btn-auth { background: var(--primary); }
        .btn-photo { background: var(--warning); margin: 10px 0; }
        .btn-submit { background: var(--success); margin-top: 25px; font-size: 1.1rem; }
        .hidden { display: none; }
        #photo-preview-container { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
        .preview-box { width: 70px; height: 70px; border-radius: 6px; overflow: hidden; border: 1px solid #ddd; position: relative; }
        .preview-box img { width: 100%; height: 100%; object-fit: cover; }
        .status-tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; background: #e8f0fe; color: var(--primary); margin-bottom: 10px; }
    </style>
</head>
<body>

    <div id="step-auth" class="card">
        <h2 id="auth-status">🔐 점검자 인증</h2>
        <p>등록된 이름과 번호를 입력하세요.</p>
        <input type="text" id="loginName" placeholder="성함 입력">
        <input type="tel" id="loginPhone" placeholder="전화번호 입력 (숫자만)">
        <button onclick="handleLogin()" class="btn-auth">인증 및 점검 시작</button>
    </div>

    <form id="inspection-form" class="hidden">
        <div class="card" id="form-container">
            <div id="facility-info" class="status-tag">설비 인식 중...</div>
            <h1 id="facility-title">점검표</h1>
            <p style="font-size: 0.8rem; color: #666;">👤 점검자: <span id="display-worker"></span></p>
            <hr>

            <div id="sec-전기_01" class="hidden section-content">
                <h2>⚡ 수변전설비 (VCB/LV)</h2>
                <div class="item"><label>HV-4 VCB 전압(KV)</label><input type="number" name="vcb_kv" step="0.1"></div>
                </div>

            <div id="sec-기계_01" class="hidden section-content">
                <h2>🗜 부스터펌프 점검</h2>
                <div class="item"><label>밸브 상태</label><select name="p1_valv"><option>정상</option><option>이상</option></select></div>
            </div>

            <hr>
            <h2>📝 공통 사항</h2>
            <div class="item">
                <label>특이사항 메모</label>
                <textarea id="memo" rows="3" placeholder="내용을 입력하세요."></textarea>
            </div>
            <div class="item">
                <label>현장 사진 (최대 4장)</label>
                <button type="button" onclick="addPhoto()" class="btn-photo">📸 사진 찍기</button>
                <div id="photo-preview-container"></div>
            </div>

            <button type="button" onclick="submitToSheet()" id="submit-btn" class="btn-submit">✅ 점검 완료 및 전송</button>
        </div>
    </form>

    <script>
        // 과장님의 실제 주소로 교체하세요!
        const AUTH_URL = "https://script.google.com/macros/s/AKfycbyS_5N2XW4rT1ffJCngvRdx85nzzuDCMEqFkOlcVo5ijaGjdW2NBsOTm_kLgo9qQZ_Y/exec"; 
        const DATA_URL = "https://script.google.com/macros/s/AKfycbz_tQj2dpwgztpHW_K0UE43HsXze8Zf7Mt6e8jZM92Uf0EWQq2AP4y7kKQt1qm5yYZu/exec"; 

        const urlParams = new URLSearchParams(window.location.search);
        const fId = urlParams.get('id') || '기본설비';
        const photoData = [];

        window.onload = function() {
            const sName = localStorage.getItem('userName');
            const sPhone = localStorage.getItem('userPhone');
            if (sName && sPhone) {
                document.getElementById('loginName').value = sName;
                document.getElementById('loginPhone').value = sPhone;
                document.getElementById('auth-status').innerText = "🔄 자동 인증 중...";
                handleLogin();
            }
        };

        function handleLogin() {
            const name = document.getElementById('loginName').value.trim();
            const phone = document.getElementById('loginPhone').value.trim();
            if (!name || !phone) return;

            fetch(`${AUTH_URL}?name=${encodeURIComponent(name)}&phone=${encodeURIComponent(phone)}`)
            .then(res => res.text())
            .then(result => {
                if (result.trim() === "SUCCESS") {
                    localStorage.setItem('userName', name);
                    localStorage.setItem('userPhone', phone);
                    showForm(name, phone);
                } else {
                    alert("❌ 미등록 사용자입니다.");
                    localStorage.clear();
                    location.reload();
                }
            })
            .catch(err => {
                console.error(err);
                // 네트워크 오류 창이 떠도 이미 로그인 정보가 있으면 넘겨버림 (하이패스 보완)
                if(localStorage.getItem('userName')) showForm(name, phone);
            });
        }

        function showForm(name, phone) {
            document.getElementById('step-auth').classList.add('hidden');
            document.getElementById('inspection-form').classList.remove('hidden');
            document.getElementById('display-worker').innerText = `${name} (${phone})`;
            document.getElementById('facility-info').innerText = "인식된 설비: " + fId;
            document.getElementById('facility-title').innerText = fId + " 점검표";

            document.querySelectorAll('.section-content').forEach(s => s.classList.add('hidden'));
            const target = document.getElementById('sec-' + fId);
            if (target) target.classList.remove('hidden');
            else document.querySelectorAll('.section-content')[0].classList.remove('hidden');
        }

        function addPhoto() {
            if(photoData.length >= 4) return alert("사진은 최대 4장입니다.");
            const input = document.createElement('input');
            input.type = 'file'; input.accept = 'image/*'; input.capture = 'camera';
            input.onchange = e => {
                const reader = new FileReader();
                reader.onload = ev => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        // 사진 크기 대폭 축소 (전송 안정성 확보)
                        const MAX_WIDTH = 500;
                        canvas.width = MAX_WIDTH;
                        canvas.height = (img.height / img.width) * MAX_WIDTH;
                        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                        const data = canvas.toDataURL('image/jpeg', 0.6);
                        photoData.push(data);
                        const div = document.createElement('div');
                        div.className = 'preview-box';
                        div.innerHTML = `<img src="${data}">`;
                        document.getElementById('photo-preview-container').appendChild(div);
                    };
                    img.src = ev.target.result;
                };
                reader.readAsDataURL(e.target.files[0]);
            };
            input.click();
        }

        function submitToSheet() {
            const btn = document.getElementById('submit-btn');
            btn.innerText = "🚀 전송 중... (잠시만 기다리세요)"; 
            btn.disabled = true;

            const formData = new FormData(document.getElementById('inspection-form'));
            const dataObj = Object.fromEntries(formData.entries());
            
            const payload = {
                worker: localStorage.getItem('userName'),
                fId: fId,
                memo: document.getElementById('memo').value,
                photos: photoData,
                checkData: dataObj
            };

            fetch(DATA_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) })
            .then(() => {
                // [성공 화면 교체] 리로드 하지 않고 완료 메시지 표시
                document.getElementById('form-container').innerHTML = `
                    <div style="text-align:center; padding:40px 10px;">
                        <h1 style="color:var(--success); font-size:2rem;">✅ 전송 완료</h1>
                        <p style="font-size:1.1rem; color:#555;">데이터가 구글 시트에 안전하게 기록되었습니다.</p>
                        <p style="margin-top:20px; color:#888;">수고하셨습니다, ${payload.worker} 과장님!</p>
                        <button onclick="location.href='index.html'" style="background:#666; margin-top:30px; width:auto; padding:10px 30px;">처음으로</button>
                    </div>
                `;
            })
            .catch(err => {
                alert("전송 중 오류가 발생했습니다.");
                btn.innerText = "✅ 점검 완료 및 전송";
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
