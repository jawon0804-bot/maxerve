<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Maxerve SMART</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <script src="https://unpkg.com/html5-qrcode"></script>
	<script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --primary: #1a73e8; --success: #34a853; --warning: #f39c12; --bg: #f8f9fa; }
        body { font-family: 'Malgun Gothic', sans-serif; background-color: var(--bg); margin: 0; padding: 15px; color: #333; line-height: 1.6; }
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin-bottom: 20px; }
        h1 { font-size: 1.2rem; color: var(--primary); border-left: 5px solid var(--primary); padding-left: 10px; margin-bottom: 20px; }
        h2 { font-size: 0.95rem; background: #f1f3f4; padding: 10px; border-radius: 6px; margin: 20px 0 10px 0; font-weight: bold; }
        .item { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 0.85rem; color: #555; }
        input, select, textarea { width: 100%; padding: 15px; border: 1px solid #dadce0; border-radius: 8px; box-sizing: border-box; font-size: 1rem; margin-bottom: 5px }
        button { width: 100%; padding: 16px; border: none; border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer; color: white; display: flex; align-items: center; justify-content: center; box-sizing: border-box; min-height: 54px; line-height: 1; }
        .btn-auth { margin-top: 20px; background: var(--primary); }
        .btn-photo { background: var(--warning); margin: 10px 0; }
        .btn-submit { background: var(--success); margin-top: 25px; font-size: 1.1rem; }
        .hidden { display: none; }
        #photo-preview-container { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
        .preview-box { width: 70px; height: 70px; border-radius: 6px; overflow: hidden; border: 1px solid #ddd; position: relative; }
        .preview-box img { width: 100%; height: 100%; object-fit: cover; }
        .status-tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; background: #e8f0fe; color: var(--primary); margin-bottom: 10px; }
        /* 중앙 로고 이미지 키우기 설정 */
        #step-auth img {
            display: block;      /* 블록 요소로 만들어 중앙 정렬 가능하게 함 */
            margin: 0 auto 20px; /* 위 0, 좌우 자동(중앙), 아래 20px 여백 */
            width: 200px;        /* 로고 크기를 200px로 확대 (더 키우려면 숫자 변경) */
            max-width: 80%;      /* 화면 너비의 80%를 넘지 않게 안전장치 */
            height: auto;        /* 가로 세로 비율 유지 */
        }
        /* 컨테이너: 내부 요소들을 세로로 세우고 가운데 정렬 */
	    .qr-button-container {
    	    display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
    	    width: 100%;
            margin: 30px 0; /* 위아래 여유 공간 */
        }

        /* 동그란 버튼 스타일 */
        .transparent-circle-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: transparent;
            /* 테두리는 없애고 그림자만 남겼습니다 */
            border: none; 
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            /* 버튼 아래쪽 그늘(그림자) */
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1); 
            cursor: pointer;
            transition: all 0.3s ease;
            outline: none;
            -webkit-tap-highlight-color: transparent; /* 모바일 터치 시 파란 박스 방지 */
        }

        .transparent-circle-btn:active {
            transform: translateY(4px); /* 눌렀을 때 쏙 들어가는 느낌 */
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1);
        }

        /* 버튼 아래 글자 스타일 */
        .qr-text {
            font-size: 0.8rem;
            color: #999;
            margin-top: 12px;
            font-weight: 500;
        }

		/* 점검표 내 모든 입력창(input, select)에 적용되는 스타일 */
		.check-input {
		    width: 100%;
		    padding: 15px;
		    border: 1px solid #dadce0;
		    border-radius: 8px;
		    box-sizing: border-box;
		    font-size: 1rem;
		    margin-bottom: 10px;
		    background-color: #ffffff; /* 평상시 흰색 배경 */
		    transition: all 0.2s; /* 변할 때 부드럽게 */
		}
		
		/* 클릭(터치)했을 때 연파란색으로 변경 */
		.check-input:focus {
		    border-color: #4285f4; /* 테두리 파란색 */
		    background-color: #f0f7ff; /* 배경 연파란색 */
		    outline: none;
		    box-shadow: 0 0 8px rgba(66, 133, 244, 0.2);
		}
		
		/* 항목 이름(라벨) 스타일 - 더 깔끔하게 */
		.row label {
		    display: block;
		    font-weight: bold;
		    margin-bottom: 8px;
		    color: #333;
		    font-size: 0.95rem;
		}

		#loading-layer {
		    position: fixed;
		    top: 0; left: 0;
		    width: 100%; height: 100%;
		    background: rgba(255, 255, 255, 0.9); /* 약간 투명한 하얀 배경 */
		  /* display: flex; */
		    flex-direction: column;
		    justify-content: center;
		    align-items: center;
		    z-index: 9999; /* 최상단에 위치 */
		}
		
		/* 뱅글뱅글 돌아가는 스피너 애니메이션 */
		.spinner {
		    width: 50px;
		    height: 50px;
		    border: 5px solid #f3f3f3;
		    border-top: 5px solid #4285f4; /* 이 과장님이 좋아하시는 파란색 */
		    border-radius: 50%;
		    animation: spin 1s linear infinite;
		    margin-bottom: 15px;
		}
		
		@keyframes spin {
		    0% { transform: rotate(0deg); }
		    100% { transform: rotate(360deg); }
		}
		
		.hidden { display: none !important; }
    
	</style>
</head>
<body>

    <div id="step-auth" class="card">
        <h2 style="display: flex; align-items: center; gap: 8px;">
          <span style="font-size: 1.6rem; line-height: 1;">🪪</span>
          <span>점검자 인증</span>
        </h2>
        <p>등록된 이름과 번호를 입력하세요.</p>
        <input type="text" id="loginName" placeholder="성함 입력">
        <input type="tel" id="loginPhone" placeholder="전화번호 입력 (숫자만)">
        <button onclick="handleLogin()" class="btn-auth">인증 및 점검 시작</button>
    </div>

    <div id="step-scan" class="card hidden" style="text-align: center; padding: 40px 20px;">
    <img src="icon.png" style="width: 250px; margin-bottom: 20px; margin-left: 30px;">
    
    <h2 style="background: none; font-size: 1.2rem; color: #333;">안녕하세요, ${worker} 님!</h2>
    <p style="color: #666; margin-bottom: 30px;">준비가 완료되었습니다.<br>보관함이나 설비의 <b>태그(NFC/QR)</b>를 <br>
        스캔하여 점검을 시작해 주세요.</p>
    
    <div style="font-size: 3rem; margin-bottom: 20px;">📲</div>
    <div class="status-tag">태그 인식 대기 중...</div>

    <div class="qr-button-container">
        <button id="btn-scan" onclick="openScanner()" class="transparent-circle-btn">
            📷
        </button>
        <p class="qr-text">QR 스캔하여 점검 시작</p>
    </div>

    <div id="scanner-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:9999; text-align:center;">
        <div id="reader" style="width:300px; margin:100px auto; background:white; border-radius:15px; overflow:hidden;"></div>
        <button onclick="closeScanner()" style="margin-top:20px; padding:10px 30px; background:#fff; border:none; border-radius:5px; font-weight:bold;">닫기</button>
    </div>
</div>

	<!-- 로딩 화면 레이어 -->
	<div id="loading-layer" class="loading-layer hidden">
	    <div class="spinner"></div>
	    <p class="text-center mt-2 font-bold text-slate-600 animate-bounce">Loading data...</p>
	</div>
	
    <form id="inspection-form" class="hidden">
    <div class="card" id="form-container">
        <!-- 상단 상태 표시 (카테고리 들어갈 자리) -->
        <div id="facility-category" class="status-tag">설비 인식 중...</div>
        
        <!-- 점검표 메인 제목 (설비명이 들어갈 자리) -->
        <h1 id="facility-title">점검표 로딩 중...</h1>
        
        <p style="font-size: 0.8rem; color: #666; display: flex; align-items: center; gap: 4px;">
            <span style="font-size: 1.3rem; line-height: 1; margin-bottom: 2px;">🪪</span> 
            <span>점검자: <span id="display-worker"></span></span>
        </p>
        <hr>
        
        <!-- ✅ 시트에서 가져온 점검 항목들이 실제로 그려지는 "그릇" -->
        <div id="dynamic-items">
            <!-- 자바스크립트가 여기에 <div>항목들</div>을 채워 넣습니다 -->
        </div>

        <hr>
        <h2>📝 특이사항</h2>
        <div class="item">
            <label>📷 현장 사진 (점검, 위험물, 파손 등)</label>
            <div id="photo-preview-container"></div>
            <button type="button" onclick="addPhoto()" class="btn-photo">📸 사진 촬영 및 추가 (최대 3장)</button>
        </div>
        
        <div class="item">
            <label>특이사항 메모</label>
            <textarea id="memo" rows="3" placeholder="내용을 입력하세요."></textarea>
        </div>

        <button type="button" onclick="submitToSheet()" id="submit-btn" class="btn-submit">✅ 점검 완료 및 전송</button>
    </div>
</form>

<script>
    // [1~2번] 설정 및 초기 로드 (로딩창 제어 추가)
    const urlParams = new URLSearchParams(window.location.search);
    let fId = urlParams.get('id') || urlParams.get('fId') || ""; 
    let photoCount = 0;
    const photoData = [];

    const AUTH_URL = "https://script.google.com/macros/s/AKfycbyS_5N2XW4rT1ffJCngvRdx85nzzuDCMEqFkOlcVo5ijaGjdW2NBsOTm_kLgo9qQZ_Y/exec";
    const webAppUrl = "https://script.google.com/macros/s/AKfycbzwMeYJ-2O9sw3QY6zty3aOkUr-TtiuZrzi5qe_o9MgA7JlGYcR6TdD8NJm9xeqK6-0ug/exec"; 

    window.onload = function() {
        const savedName = localStorage.getItem('userName');
        const savedPhone = localStorage.getItem('userPhone');

        if (savedName && savedPhone) {
            const nameInput = document.getElementById('loginName');
            const phoneInput = document.getElementById('loginPhone');
            if(nameInput) nameInput.value = savedName;
            if(phoneInput) phoneInput.value = savedPhone;

            // 자동 로그인 시 로딩창이 방해하지 않도록 처리
            toggleLoading(false); 
            startInspection(savedName, savedPhone);
        } else {
            document.getElementById('step-auth').classList.remove('hidden');
        }
    };

    // 3. 인증 버튼 클릭 시 실행 (구글 시트 인증 포함)
    function handleLogin() {
        const name = document.getElementById('loginName').value.trim();
        const phone = document.getElementById('loginPhone').value.trim();

        if (!name || !phone) { alert("성함과 번호를 입력해주세요."); return; }

        const btn = document.querySelector('button[onclick="handleLogin()"]');
        if(btn) btn.innerText = "인증 중...";

        // 구글 시트에 사용자 확인 요청
        const authCheckUrl = `${AUTH_URL}?name=${encodeURIComponent(name)}&phone=${encodeURIComponent(phone)}`;

        fetch(authCheckUrl)
        .then(res => res.text())
        .then(result => {
            if (result.trim() === "SUCCESS") {
                localStorage.setItem('userName', name);
                localStorage.setItem('userPhone', phone);
                // 인증 성공시에만 점검 화면으로 이동!
                startInspection(name, phone);
            } else {
                alert("❌ 등록되지 않은 사용자입니다. 관리자에게 문의하세요.");
                if(btn) btn.innerText = "인증 및 점검 시작";
            }
        })
        .catch(err => {
            console.error(err);
            // 네트워크 오류 시 기존 정보가 있다면 일단 통과
            if(localStorage.getItem('userName')) {
                startInspection(name, phone);
            } else {
                alert("🌐 연결이 불안정합니다. 다시 시도해주세요.");
                if(btn) btn.innerText = "인증 및 점검 시작";
            }
        });
    }

    // [4번] 점검 시작 분기 (수정됨: NFC 대기 화면 시 로딩창 끄기)
    function startInspection(name, phone) {
        document.getElementById('step-auth').classList.add('hidden');
        toggleLoading(false); // NFC 스캔 화면이 보여야 하므로 로딩창 종료

        const welcomeName = document.querySelector('#step-scan h2');
        if (welcomeName) welcomeName.innerText = "안녕하세요, " + name + " 님!";
        
        const workerDisplay = document.getElementById('display-worker');
        if(workerDisplay) workerDisplay.innerText = name + "(" + phone + ")";

        let cleanFId = decodeURIComponent(fId).trim();

        if (!cleanFId || cleanFId === "" || cleanFId === "미등록설비") {
            document.getElementById('step-scan').classList.remove('hidden');
            document.getElementById('inspection-form').classList.add('hidden');
        } else {
            loadFacilityConfig(cleanFId); // 실제 데이터 로드 시에만 로딩창 작동
        }
    }

    // [5번] 데이터 로드 (수정됨: 통신 시점에만 로딩창 켜기)
    function loadFacilityConfig(targetFid) {
	    toggleLoading(true); // 로딩 화면 시작
	
	    // 100ms 정도 짧은 대기 후 서버 통신 시작
	    setTimeout(() => {
	        fetch(`${webAppUrl}?fid=${encodeURIComponent(targetFid)}`)
	            .then(res => res.text()) // 우선 텍스트로 받아서 분석합니다.
	            .then(text => {
				    const trimmedText = text.trim();
				    console.log("서버 응답 데이터:", trimmedText); // 디버깅용: F12 개발자 도구에서 확인 가능
				
				    // 1️⃣ [가장 먼저 체크] 순찰 완료 메시지인가? 
				    // 기호(✅)가 포함되어 있고, { 로 시작하지 않으면 100% 순찰 메시지입니다.
				    if (trimmedText.includes("✅") && !trimmedText.startsWith("{")) {
				        alert(trimmedText); // 과장님이 설정하신 D열 메시지 출력
				        
				        // 주소창 fid 삭제 (무한 루프 방지)
				        const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
				        window.history.replaceState({}, document.title, cleanUrl);
				
				        // 화면 상태 초기화
				        document.getElementById('step-scan').classList.remove('hidden');
				        document.getElementById('inspection-form').classList.add('hidden');
				        
				        toggleLoading(false);
				        return; // 여기서 로직 종료! (JSON 파싱으로 넘어가지 않음)
				    }
				
				    // 2️⃣ [그다음 체크] 일반 점검표 데이터인가?
				    if (trimmedText.startsWith("{")) {
				        try {
				            const response = JSON.parse(trimmedText);
				            
				            // 점검표 화면 표시 로직
				            document.getElementById('step-scan').classList.add('hidden');
				            document.getElementById('inspection-form').classList.remove('hidden');
				
				            const titleEl = document.getElementById('facility-title');
				            if(titleEl) titleEl.innerText = "📋 " + response.facilityName;
				
				            // 점검 항목 동적 생성
				            renderDynamicForm(response.configString);
				            
				            setTimeout(() => toggleLoading(false), 300);
				        } catch (e) {
				            console.error("JSON 파싱 실패:", e);
				            alert("⚠️ 데이터 처리 에러: 점검표 형식이 올바르지 않습니다.");
				            toggleLoading(false);
				        }
				    } else {
				        // 3️⃣ 둘 다 해당 안 되는 알 수 없는 응답
				        alert("⚠️ 알 수 없는 응답: " + trimmedText);
				        toggleLoading(false);
				    }
				})
			})
		}

    // 6. 유동적 항목 생성 로직
   function renderDynamicForm(configString) {
	    if(!configString) return;
	    const items = configString.split(';'); 
	    const container = document.getElementById('dynamic-items');
	    container.innerHTML = "";
	
	    items.forEach(item => {
	        if(!item.trim()) return;
	        
	        const [name, type, placeholderText] = item.split('|');
	        const hint = placeholderText ? placeholderText : "내용을 입력하세요";
	        
	        // [설명] 제목 태그를 미리 만듭니다. (모든 항목의 기본값)
	        let labelTag = `<label style="display:block; font-weight:bold; margin-bottom:5px;">${name}</label>`;
	        let inputTag = "";
	
	        // 1. 구분선(line) 처리
	        if (type && type.trim() === 'line') {
	            container.innerHTML += `<hr style="border:0; height:2px; background:#007bff; margin:25px 0;">`;
	            return; 
	        }
	
	        // 2. 타입별 분기 처리
	        if (type === 'select') {
	            /* 
	               [수정 포인트] 
	               이전 코드에 있던 labelTag = ""; 를 삭제했습니다. 
	               그래야 '소화기...' 같은 긴 제목이 박스 위에 정상적으로 출력됩니다.
	            */
	            
	            // 시트에서 가져온 옵션들(양호,불량 등)을 <option> 태그로 변환합니다.
	            const options = placeholderText ? placeholderText.split(',') : [];
	            const optHtml = options.map(o => `<option value="${o}">${o}</option>`).join('');
	            
	            /* 
	               [설명] 
	               박스 첫 줄은 무조건 "선택"으로 표시합니다. 
	               여기에 ${name}을 넣지 않아서 박스 안이 깔끔해집니다.
	            */
	            inputTag = `<select class="check-input">
	                            <option value="">선택</option>
	                            ${optHtml}
	                        </select>`;
	        } 
	        else if (type === 'info') {
	            // info는 박스 자체가 안내문이므로 위쪽 제목(labelTag)을 비웁니다.
	            labelTag = ""; 
	            inputTag = `<div style="padding: 5px 0; color: #666; font-size: 0.95em; line-height: 1.5;">
	                            ℹ️ <strong>${name}</strong>: ${hint}
	                        </div>`;
	        } 
	        else if (type === 'number') {
	            // 숫자는 위에서 만든 labelTag(제목)가 그대로 유지됩니다.
	            inputTag = `<input type="number" class="check-input" placeholder="${hint}">`;
	        } 
	        else {
	            // 일반 텍스트도 제목이 그대로 노출됩니다.
	            inputTag = `<input type="text" class="check-input" placeholder="${hint}">`;
	        }
	        
	        // 3. 최종 조립
	        // 결정된 labelTag(제목)와 inputTag(입력창)를 한 줄로 합쳐 화면에 뿌립니다.
	        container.innerHTML += `
	            <div class="row" style="margin-bottom:15px;">
	                ${labelTag}
	                ${inputTag}
	            </div>`;
	    });
	}

     // 7. 사진 추가 및 압축 (기존 로직 최적화)
    function addPhoto() {
        if(photoCount >= 3) { alert("사진은 4장까지만 가능합니다."); return; }

        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.capture = 'camera';

        input.onchange = e => {
            const file = e.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = event => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        // 전송 성공률을 높이기 위해 최대 너비 600으로 조정
                        const MAX_WIDTH = 600; 
                        let width = img.width;
                        let height = img.height;
                        if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                        
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        // 압축률 0.6으로 조정 (용량 최적화)
                        const compressedData = canvas.toDataURL('image/jpeg', 0.6);
                        
                        const photoId = Date.now();
                        photoCount++;
                        
                        const preview = document.createElement('div');
                        preview.id = `photo-${photoId}`;
                        preview.className = 'preview-box';
                        preview.style = "position:relative; display:inline-block; margin:5px;";
                        preview.innerHTML = `
                            <img src="${compressedData}" style="width:100px; height:100px; object-fit:cover; border-radius:5px; border:1px solid #ccc;">
                            <div onclick="removeSpecificPhoto(${photoId}, '${compressedData}')" 
                                 style="position:absolute; top:-5px; right:-5px; background:red; color:white; width:22px; height:22px; 
                                        border-radius:50%; text-align:center; line-height:20px; cursor:pointer;">×</div>
                        `;
                        
                        document.getElementById('photo-preview-container').appendChild(preview);
                        photoData.push(compressedData); 
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        };
        input.click();
    }

    function removeSpecificPhoto(id, data) {
        const element = document.getElementById(`photo-${id}`);
        if (element) element.remove();
        const index = photoData.indexOf(data);
        if (index > -1) {
            photoData.splice(index, 1);
            photoCount--;
        }
    }
    // 8. QR 코드 스캔
	let html5QrCode;
	
	function openScanner() {
	    document.getElementById('scanner-modal').style.display = 'block';
	    html5QrCode = new Html5Qrcode("reader");
	
	    const config = { fps: 20, qrbox: { width: 250, height: 250 } };
	
	    html5QrCode.start(
	        { facingMode: "environment" },
	        config,
	        (decodedText) => {
	            const cleanUrl = decodeURIComponent(decodedText).trim();
	
	            html5QrCode.stop().then(() => {
	                document.getElementById('scanner-modal').style.display = 'none';
	
	                setTimeout(() => {
	                    if (confirm("점검 대상이 확인되었습니다.\n해당 점검표로 이동하려면 확인 버튼을 누르세요!")) {
	                        location.href = cleanUrl;
	                    }
	                }, 100);
	            }).catch(err => {
	                console.error("멈춤 실패:", err);
	                location.href = cleanUrl;
	            });
	        }
	    ); // <--- 이 부분! start 함수를 닫는 괄호가 꼭 있어야 합니다.
	} // <--- 이 부분! openScanner 함수를 완전히 닫아주는 괄호입니다.

    function closeScanner() {
	    if (html5QrCode) {
	        html5QrCode.stop().then(() => {
	            document.getElementById('scanner-modal').style.display = 'none';
	        }).catch(() => {
	            document.getElementById('scanner-modal').style.display = 'none';
	        });
	    } else {
	        document.getElementById('scanner-modal').style.display = 'none';
	    }
	}
		
			// 뒤로가기 감지 및 제어
	    history.pushState(null, null, location.href); // 현재 상태를 역사에 한 번 더 밀어넣기
	
	    window.onpopstate = function() {
	        // 사용자가 뒤로가기를 누르면 이 함수가 실행됩니다.
	        if (confirm("점검 시스템을 종료하시겠습니까?")) {
	            window.close(); // 브라우저 창 닫기 (앱 형태일 때 작동)
	            // 만약 창이 안 닫히면 메인 빈 페이지나 종료 안내 페이지로 보낼 수도 있습니다.
	        } else {
	            // 취소를 누르면 다시 현재 상태로 고정
	            history.pushState(null, null, location.href);
	        }
	    };

   // 9. 백엔드 전송 (20개 항목 배열 맞춤형)
    function submitToSheet() {
        const worker = localStorage.getItem('userName') || "미인증";
        const memo = document.getElementById('memo').value;
        const btn = document.querySelector('.btn-submit');

        // 1. 유동적으로 생성된 모든 input 값을 순서대로 수집
        const inputs = document.querySelectorAll('.check-input');
        let detailData = [];
        inputs.forEach(el => detailData.push(el.value || ""));

        // 2. [중요] 20개 칸을 맞추기 위해 빈 데이터 채우기
        let finalValues = new Array(20).fill("");
        for(let i=0; i<detailData.length; i++) {
            finalValues[i] = detailData[i];
        }

        if(confirm("점검 데이터를 전송하시겠습니까?")) {
            btn.innerText = "🚀 전송 중...";
            btn.disabled = true;

            fetch(webAppUrl, {
                method: 'POST',
                // mode: 'no-cors'는 삭제했습니다!
                body: JSON.stringify({
                    worker: worker,
                    fId: fId,
                    memo: memo,
                    photoData: photoData,
                    values: finalValues
                })
            })
            .then(res => res.text()) // 텍스트로 먼저 변환
            .then(result => {
                console.log("응답 결과:", result); // 디버깅용
                
                // 결과에 SUCCESS가 포함되어 있으면 통과!
                if (result.indexOf("SUCCESS") !== -1) {
                    alert("✅ 점검 결과가 정상적으로 전송되었습니다.");
                    
                    document.getElementById('submit-btn').disabled = true;
                    document.getElementById('submit-btn').innerText = "전송 완료";

                    setTimeout(function() {
                        window.close();
                        document.body.innerHTML = "<h2 style='text-align:center; margin-top:50px;'>점검 완료!<br>창을 닫아주세요.</h2>";
                    }, 1000);
                } else {
                    // SUCCESS가 아닌 에러 메시지가 왔을 때
                    alert("전송 실패: " + result);
                    btn.innerText = "다시 시도";
                    btn.disabled = false;
                }
            })
            .catch(err => {
                // 아예 통신 자체가 실패했을 때 (오타 등)
                console.error("전송 에러:", err);
                alert("네트워크 오류가 발생했습니다.");
                btn.innerText = "다시 시도";
                btn.disabled = false;
            });
		}
	}

	// [10번] 로딩창 마스터 스위치 (이 함수는 맨 아래에 새로 추가!)
    function toggleLoading(isVisible) {
        const loader = document.getElementById('loading-layer');
        if (!loader) return;

        if (isVisible) {
            loader.style.setProperty('display', 'flex', 'important');
            loader.classList.remove('hidden');
        } else {
            loader.style.setProperty('display', 'none', 'important');
            loader.classList.add('hidden');
        }
    }
